<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Scanning Reticle / AI Viewfinder -->
  <path d="M 96 176 L 96 112 A 16 16 0 0 1 112 96 L 176 96" fill="none" stroke="#86efac" stroke-width="18" stroke-linecap="round" />
  <path d="M 416 176 L 416 112 A 16 16 0 0 0 400 96 L 336 96" fill="none" stroke="#86efac" stroke-width="18" stroke-linecap="round" />
  <path d="M 96 336 L 96 400 A 16 16 0 0 0 112 416 L 176 416" fill="none" stroke="#86efac" stroke-width="18" stroke-linecap="round" />
  <path d="M 416 336 L 416 400 A 16 16 0 0 1 400 416 L 336 416" fill="none" stroke="#86efac" stroke-width="18" stroke-linecap="round" />

  <!-- AI Pulse Scan Line -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#4ade80" stroke-width="6" stroke-dasharray="12 12" opacity="0.8" filter="url(#glow)" />

  <!-- Central Stylized Plant Leaf -->
  <path d="M 256 120 C 330 120 370 190 370 270 C 370 350 300 390 256 400 C 212 390 142 350 142 270 C 142 190 182 120 256 120 Z" fill="url(#leaf)" />
  
  <!-- Central Leaf Vein -->
  <path d="M 256 140 L 256 380" stroke="#14532d" stroke-width="10" stroke-linecap="round" />
  <path d="M 256 220 C 285 205 315 210 330 225" fill="none" stroke="#14532d" stroke-width="8" stroke-linecap="round" />
  <path d="M 256 270 C 227 255 197 260 182 275" fill="none" stroke="#14532d" stroke-width="8" stroke-linecap="round" />
  <path d="M 256 320 C 285 305 315 310 330 325" fill="none" stroke="#14532d" stroke-width="8" stroke-linecap="round" />

  <!-- AI Sparkle / Target Indicator -->
  <circle cx="350" cy="160" r="16" fill="#facc15" filter="url(#glow)" />
</svg>
